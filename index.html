        </div>
      `;
    }

    function buildEndHTML(){
      const unlockedMeta = getUnlockedTrophies();
      const unlockedCount = ALL_TROPHIES.filter(t => unlockedMeta[t.id]).length;
      
      let scoreGrade = "B";
      let scoreTitle = "Ejecutivo Promedio";
      let scoreColor = "var(--electric-blue)";

      if(S.cash < 0){
        scoreGrade = "F";
        scoreTitle = "Retiro en Quiebra y Endeudado";
        scoreColor = "var(--hot-pink)";
        S.endReason = "Jubilación con Deudas";
      } else if(S.maxOvr >= 90 && S.cash >= 2000000){
        scoreGrade = "S+";
        scoreTitle = "Leyenda Inmortal de Wall Street";
        scoreColor = "var(--gold)";
        unlockTrophy('chairman');
      } else if(S.maxOvr >= 75 && S.cash >= 600000){
        scoreGrade = "A";
        scoreTitle = "Tiburón del Directorio";
        scoreColor = "var(--money)";
      } else if(S.maxOvr >= 55 && S.cash >= 150000){
        scoreGrade = "B";
        scoreTitle = "Director Consolidado";
        scoreColor = "var(--electric-blue)";
      } else {
        scoreGrade = "C";
        scoreTitle = "Burócrata Corporativo Promedio";
        scoreColor = "var(--cyber-amber)";
      }

      if(!S.firedCompanies || S.firedCompanies.length === 0){
        unlockTrophy('purga');
      }

      const companiesWorked = {};
      (S.rows || []).forEach(r => {
        if(r.co && r.co.n) {
          companiesWorked[r.co.n] = (companiesWorked[r.co.n] || 0) + 1;
        }
      });

      const o = ORIGINS.find(x => x.id === S.origin) || ORIGINS[0];
      const initialHeritage = o.cash > 0 ? o.cash : 0;
      const boughtOvr = S.purchasedOvrPoints || 0;
      const organicMaxOvr = Math.max(36, S.maxOvr - boughtOvr);

      return `
        <div class="end-wrap" style="max-width:760px; margin:0 auto; padding: 20px 14px; width:100%;">
          
          <div style="background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(16,229,117,0.05)); border: 1.5px solid var(--gold); border-radius: 20px; padding: 20px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
            <span style="font-size: 0.68rem; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold);">Reporte Final de Carrera</span>
            <h2 style="font-family: var(--font-brand); font-size: 2.1rem; font-weight: 900; color: #fff; margin: 4px 0;">${esc(S.endReason ? S.endReason.toUpperCase() : 'CARRERA FINALIZADA')}</h2>
            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); margin-top: 4px;">
              <span style="font-size: 1.3rem; font-weight: 900; color: ${scoreColor}; font-family: var(--font-num);">${scoreGrade}</span>
              <span style="font-size: 0.84rem; font-weight: 800; color: #fff;">${scoreTitle}</span>
            </div>
          </div>

          <!-- Balance Satírico de Mérito vs Herencia -->
          <div style="background: var(--card-inner); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 0.76rem; color: var(--text-muted); line-height: 1.45;">
            <b style="color:var(--gold); display:block; margin-bottom:3px;">📊 Auditoría de Mérito vs. Billetera:</b>
            OVR Ganado Trabajando: <strong style="color:#fff;">${organicMaxOvr} pts</strong> • OVR Comprado con Guita: <strong style="color:var(--hot-pink);">${boughtOvr} pts</strong><br>
            ${o.id === 'trust' ? '🏛️ <em>"El 80% de tu éxito fue nacer en la familia correcta."</em>' : '🥊 <em>"Cada peso y punto de OVR fue ganado a pulmón en la trinchera."</em>'}
          </div>

          <!-- 4 KPIs Clave -->
          <div class="end-stat-grid" style="width:100%;">
            <div class="end-stat">
              <div class="l">OVR Máximo</div>
              <div class="v" style="color:var(--gold);">${S.maxOvr}</div>
            </div>
            <div class="end-stat">
              <div class="l">Rango Máximo</div>
              <div class="v" style="font-size:0.96rem;">${esc(S.maxRank ? S.maxRank.n : 'Pasas manteca')}</div>
            </div>
            <div class="end-stat">
              <div class="l">Patrimonio Final</div>
              <div class="v ${S.cash<0?'red':'green'}">${money(S.cash)}</div>
            </div>
            <div class="end-stat">
              <div class="l">Edad de Retiro</div>
              <div class="v">${S.age} años</div>
            </div>
          </div>

          <!-- Meta-Progresión de Trofeos Persistentes -->
          <div style="background: var(--card-inner); border: 1px solid var(--border); border-radius: 16px; padding: 16px; width: 100%; text-align: left; margin-top: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
              <h3 style="font-family: var(--font-brand); font-size: 0.94rem; font-weight: 900; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 6px;">
                🏆 Colección Global de Logros
              </h3>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-family: var(--font-num); font-size: 0.76rem; font-weight: 800; color: var(--money); background: rgba(16,229,117,0.12); padding: 3px 9px; border-radius: 10px;">${unlockedCount} / ${ALL_TROPHIES.length} Desbloqueados</span>
                <button type="button" class="btn ghost" style="padding:4px 8px; font-size:0.68rem;" onclick="resetAllTrophies()">🗑️ Reiniciar</button>
              </div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;">
              ${ALL_TROPHIES.map(t => {
                const isUnlocked = !!unlockedMeta[t.id];
                return `
                  <div style="background: ${isUnlocked ? 'linear-gradient(135deg, rgba(255,215,0,0.15), rgba(16,229,117,0.05))' : '#080c14'}; border: 1px solid ${isUnlocked ? 'var(--gold)' : 'var(--border)'}; border-radius: 12px; padding: 10px; opacity: ${isUnlocked ? '1' : '0.4'}; transition: all 0.2s;">
                    <div style="font-size: 1.4rem; margin-bottom: 4px;" aria-hidden="true">${t.ic}</div>
                    <div style="font-size: 0.78rem; font-weight: 800; color: ${isUnlocked ? '#fff' : 'var(--text-dim)'};">${esc(t.n)}</div>
                    <div style="font-size: 0.68rem; color: var(--text-muted); line-height: 1.3; margin-top: 2px;">${esc(t.d)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Resumen de Empresas Transitadas -->
          <div style="background: var(--card-inner); border: 1px solid var(--border); border-radius: 16px; padding: 14px; width: 100%; text-align: left; margin-top: 12px;">
            <h3 style="font-family: var(--font-brand); font-size: 0.88rem; font-weight: 900; text-transform: uppercase; color: var(--electric-blue); margin-bottom: 8px;">
              🏢 Currículum Vitae (Empresas Transitadas)
            </h3>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              ${Object.keys(companiesWorked).map(coName => {
                const count = companiesWorked[coName];
                return `
                  <span style="background: #080c14; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 0.74rem; font-weight: 700; color: #fff;">
                    ${esc(coName)} <small style="color:var(--text-muted);">(${count} ${count > 1 ? 'años' : 'año'})</small>
                  </span>
                `;
              }).join('')}
            </div>
          </div>

          <button type="button" class="btn" style="margin-top:20px; width:100%; max-width:340px; padding:14px;" onclick="initSetup()">COMENZAR NUEVA CARRERA</button>
        </div>
      `;
    }

    function renderEventModal(){
      const container = document.getElementById("eventModalContainer");
      if(!container) return;
      if(!S || (S.phase !== "choice" && S.phase !== "rolling" && S.phase !== "event_result") || !S.choice){
        container.innerHTML = "";
        return;
      }

      const c = S.choice;
      const imgUrl = EVENT_IMAGES[c.imgKey] || EVENT_IMAGES.cut;

      if(S.phase === "event_result" && pendingEventResult){
        const res = pendingEventResult;
        const isGood = res.isPositive;
        container.innerHTML = `
          <div class="event-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalResultTitle">
            <div class="event-modal">
              <div class="event-result-box ${isGood ? 'good' : 'bad'}">
                <span class="tag-res">${isGood ? '✨ ÉXITO ROTUNDO' : '⚠️ GOLPE ADVERSO'}</span>
                <h3 id="modalResultTitle">${esc(res.label)}</h3>
                <div class="metrics-row">
                  <span class="num ${isGood ? 'up' : 'down'}">${esc(res.metricText)}</span>
                </div>
                <button type="button" class="btn" style="margin-top:8px; width:100%;" onclick="finishEventAndAdvance()">CONTINUAR CARRERA</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="event-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalEventTitle">
          <div class="event-modal">
            <div class="event-modal-badge">⚡ Decisión Crítica de Gestión</div>
            
            <div class="event-art-box">
              <img src="${imgUrl}" alt="${esc(c.t)}" width="800" height="450" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('sin-arte')">
              <div class="art-overlay"></div>
            </div>

            <h2 id="modalEventTitle">${esc(c.t)}</h2>
            <p>${esc(c.s)}</p>
            
            <div class="event-grid">
              ${c.o.map((opt, i) => `
                <div class="event-card ${S.phase==='rolling' && S.rolling.oi===i ? 'spinning':''}" role="button" tabindex="0" ${S.phase==='choice' ? `onclick="resolveChoice(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();resolveChoice(${i});}"` : ''}>
                  <div class="card-kicker">${esc(opt.tag)}</div>
                  <div class="company-name" style="font-size:0.96rem;">${esc(opt.n)}</div>
                  <div class="outcomes">
                    ${opt.roll.map((rl, j) => {
                      let tagText = "";
                      if(rl.type === "ovr") tagText = `${rl.val > 0 ? '+' : ''}${rl.val} OVR`;
                      else if(rl.type === "cash") tagText = `${rl.val > 0 ? '+' : ''}${money(rl.val)}`;
                      else if(rl.type === "promote") tagText = "🎖️ ASCENSO DIRECTO";
                      else if(rl.type === "fire") tagText = "⚠️ DESPIDO INMEDIATO";

                      return `
                        <div class="outcome outcome-slot-${j}">
                          <div class="oc-head">
                            <span>${esc(rl.label)}</span>
                            <b>${rl.p}%</b>
                          </div>
                          <div class="oc-big">
                            <span class="num ${rl.isPositive ? 'up' : 'down'}">${esc(tagText)}</span>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderOverlay(){
      const el = document.getElementById("overlay");
      if(!el) return;
      if(!S || !S.milestones || !S.milestones.length){
        el.innerHTML = "";
        return;
      }
      const m = S.milestones[0];
      el.innerHTML = `
        <div class="overlay" role="dialog" aria-modal="true">
          <div class="mile ${m.tone || 'good'}">
            <div class="ic" aria-hidden="true">${m.ic || '🏆'}</div>
            <div class="kick">${esc(m.kick)}</div>
            <h3>${esc(m.title)}</h3>
            <p class="sub">${esc(m.sub)}</p>
            <button type="button" class="btn" onclick="closeMilestone()">${esc(m.cta || 'Continuar')}</button>
          </div>
        </div>
      `;
    }

    function closeMilestone(){
      if(S && S.milestones){
        S.milestones.shift();
      }
      renderApp();
    }

    /* ================= RENDERIZADOR PRINCIPAL Y ROUTER ================= */
    let currentTab = 'game';

    function switchTab(tab){
      currentTab = tab;
      const btnGame = document.getElementById("tabGameBtn");
      const btnTimeline = document.getElementById("tabTimelineBtn");
      const panelGame = document.getElementById("gamePanel");
      const panelTimeline = document.getElementById("timelinePanel");

      if(btnGame && btnTimeline){
        btnGame.className = `tab-btn ${tab==='game'?'active':''}`;
        btnTimeline.className = `tab-btn ${tab==='timeline'?'active':''}`;
      }
      if(panelGame && panelTimeline){
        if(tab === 'game'){
          panelGame.classList.remove("is-hidden-mobile");
          panelTimeline.classList.add("is-hidden-mobile");
        } else {
          panelGame.classList.add("is-hidden-mobile");
          panelTimeline.classList.remove("is-hidden-mobile");
        }
      }
    }

    /* ================= ANIMACIÓN DEL CONTADOR DE OVR =================
       S.displayOvr es la posición actual del contador; computeOvr() es el
       valor real. tickOvr es lo ÚNICO que las acerca: si se borra esta
       función o la llamada del final de renderApp, el badge se congela.

       Al cambiar de dirección (venía subiendo y ahora baja, o al revés) se
       saca la clase contraria ANTES de agregar la nueva, para que nunca
       queden "rising" y "falling" pegadas juntas. ==================== */
    let ovrTickTimer = null;
    const CLASES_OVR = ["ovr-bronce","ovr-plata","ovr-esmeralda","ovr-zafiro","ovr-oro","ovr-sayayin"];

    function pintarBadge(valor){
      const box = document.getElementById("ovrBadge");
      if(!box || !box.classList) return;
      CLASES_OVR.forEach(c => box.classList.remove(c));
      box.classList.add(ovrColorClass(valor));
    }

    function tickOvr(){
      if(!S) return;
      const num = document.getElementById("ovrNum");
      if(!num) return;
      const box = document.getElementById("ovrBadge");
      const target = computeOvr();
      if(S.displayOvr === undefined) S.displayOvr = target;

      if(S.displayOvr === target){
        if(box && box.classList) box.classList.remove("rising", "falling");
        pintarBadge(target);
        return;
      }

      if(box && box.classList){
        const subiendo = target > S.displayOvr;
        box.classList.remove(subiendo ? "falling" : "rising");
        box.classList.add(subiendo ? "rising" : "falling");
      }
      if(ovrTickTimer) clearTimeout(ovrTickTimer);

      const paso = () => {
        if(!S) return;
        const n = document.getElementById("ovrNum");
        if(!n) return;
        if(S.displayOvr === target){
          const b = document.getElementById("ovrBadge");
          if(b && b.classList) b.classList.remove("rising", "falling");
          pintarBadge(target);
          return;
        }
        S.displayOvr += S.displayOvr < target ? 1 : -1;
        n.textContent = S.displayOvr;
        pintarBadge(S.displayOvr);
        ovrTickTimer = setTimeout(paso, 55);
      };
      ovrTickTimer = setTimeout(paso, 140);
    }

    function renderApp(){
      const board = document.getElementById("board");
      const nav = document.getElementById("mobileNav");
      if(!board) return;

      if(!S){
        if(nav) nav.style.display = "none";
        board.style.gridTemplateColumns = "1fr";
        board.innerHTML = buildLandingHTML();
        renderOverlay();
        renderEventModal();
        saveRun();
        return;
      }

      if(S.phase === "setup"){
        if(nav) nav.style.display = "none";
        board.style.gridTemplateColumns = "1fr";
        board.innerHTML = buildSetupHTML();
        renderOverlay();
        renderEventModal();
        saveRun();
        return;
      }

      if(S.phase === "end"){
        if(nav) nav.style.display = "none";
        board.style.gridTemplateColumns = "1fr";
        board.innerHTML = buildEndHTML();
        renderOverlay();
        renderEventModal();
        saveRun();
        return;
      }

      // En partida activa
      if(nav) nav.style.display = "grid";
      board.innerHTML = `
        <div class="tab-panel ${currentTab==='game'?'':'is-hidden-mobile'}" id="gamePanel">
          <div class="left-col">
            ${buildIdentityHTML()}
            ${buildWealthHTML()}
            ${S.flash ? `<div class="flash ${S.flash.good?'good':'bad'}"><div class="fh"><span>${esc(S.flash.title)}</span></div></div>` : ''}
            ${buildDecisionHTML()}
          </div>
        </div>
        <div class="tab-panel ${currentTab==='timeline'?'':'is-hidden-mobile'}" id="timelinePanel">
          ${buildGigWidgetHTML()}
        </div>
      `;

      renderOverlay();
      renderEventModal();
      tickOvr();               // ← anima el badge hasta el OVR real
      saveRun(); // P0-5: Guardado automático constante
    }

    function initSetup(){
      S = {
        phase: "setup",
        pace: PACE,
        origin: "mba",
        gender: "H",
        apellido: ""
      };
      renderApp();
    }

    function startCareer(){
      const o = ORIGINS.find(x => x.id === S.origin) || ORIGINS[0];
      const st = { ...o.stats }, comp = {};
      for(const k in o.comp) comp[k] = clamp(o.comp[k] + rndInt(-3, 3));
      for(const k in st) st[k] = clamp(st[k] + rndInt(-2, 2));

      const inputEl = document.getElementById("setupInputApellido");
      let finalName = "";
      if(inputEl && inputEl.value.trim()){
        finalName = inputEl.value.trim().toUpperCase();
      } else if(S.apellido && S.apellido.trim()){
        finalName = S.apellido.trim().toUpperCase();
      } else {
        const sampleNames = ["JAVIER", "SANTIAGO", "MARTÍN", "FACUNDO", "CAMILA", "LUCÍA", "MATÍAS", "VALENTINA", "JOAQUÍN", "SOFÍA"];
        finalName = rnd(sampleNames);
      }

      S = {
        phase: "offer",
        pace: S.pace || PACE,
        origin: S.origin,
        gender: S.gender,
        apellido: finalName,
        stats: st,
        comp: comp,
        area: null,
        rep: o.rep,
        tierBonus: 0,
        statusBonus: 0,
        purchasedOvrPoints: 0,
        ovrPenalties: 0,
        age: 22,
        cash: o.cash,
        salary: 0,
        company: null,
        rows: [],
        milestones: [],
        maxOvr: 0,
        maxRank: null,
        badYears: 0,
        extensiones: 0,
        lastEventAge: 18,
        crisis40Triggered: false,
        
        usedWealthThisRound: false,
        purchasedOnce: {},
        cooldowns: {},
        equityCompanies: [],
        firedCompanies: [],
        eventsTriggeredCount: 0,
        seenEventIds: [],
        yearsInCurrentCompany: 0,
        offers: makeOffers(1, 3)
      };

      S.rank = rankOf(computeOvr());
      
      trackPeaks();
      renderApp();
    }

    // Inicialización automática
    if(typeof window !== "undefined" && typeof window.addEventListener === "function") { window.addEventListener("DOMContentLoaded", () => {
      const saved = loadRun();
      const continueBtn = document.getElementById("continueBtnLanding");
      if(saved && continueBtn){
        continueBtn.style.display = "inline-block";
        continueBtn.textContent = `▶️ Continuar Carrera (${saved.apellido} - Edad ${saved.age})`;
      }
    });
    }

  </script>
</body>
</html>
