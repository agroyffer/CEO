<!DOCTYPE html><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market CAPo — simulador de carrera corporativa</title>
<style>
:root{
  --bg:#0c0e0d; --panel:#141817; --panel-2:#1b201e; --line:#2a312e;
  --money:#3fb950; --red:#d1495b; --amber:#e0a030; --blue:#5f9ad0; --purple:#8a5fd0;
  --ink:#e6ece9; --muted:#7d8a85; --dim:#4d5854;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;padding:18px 12px 44px;-webkit-font-smoothing:antialiased;}
.masthead{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:16px;flex-wrap:wrap;}
.masthead .mark{width:22px;height:22px;border-radius:5px;background:var(--money);display:flex;align-items:center;justify-content:center;color:#0c0e0d;font-weight:900;font-size:.8rem;}
.masthead h1{font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;font-weight:800;}
.masthead .tagline{font-size:.6rem;color:var(--dim);letter-spacing:.1em;}

.board{max-width:1120px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;}
@media(max-width:880px){.board{grid-template-columns:1fr;}}

/* ficha */
.identity{display:flex;gap:10px;margin-bottom:12px;}
.ovrblock{width:76px;flex-shrink:0;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;}
.ovrblock small{font-size:.5rem;letter-spacing:.14em;font-weight:800;opacity:.7;}
.ovrblock b{font-size:2.05rem;line-height:1;font-variant-numeric:tabular-nums;font-weight:900;}
.ovrblock .rk{font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:4px;opacity:.82;text-align:center;line-height:1.15;}
.avatarbox{width:60px;flex-shrink:0;border-radius:9px;background:linear-gradient(165deg,#242c28,#151a18);border:1px solid var(--line);overflow:hidden;position:relative;}
.avatarbox svg{width:100%;height:100%;display:block;}
.avatarbox .lvl{position:absolute;left:0;right:0;bottom:0;background:rgba(8,10,9,.86);text-align:center;padding:2px 0 3px;}
.avatarbox .lvl b{font-size:.9rem;font-weight:900;display:block;line-height:1;}
.avatarbox .lvl small{font-size:.42rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
.namecard{flex:1;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);padding:9px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
.namecard .tags{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.tag{font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 6px;border-radius:4px;background:#252b29;color:var(--muted);}
.tag.role{background:#1e2a38;color:#7fb2e0;}
.tag.band{background:#2e2416;color:#e0b860;}
.tag.lane-der{background:#16301f;color:#5fd07f;}
.tag.lane-izq{background:#301a1a;color:#e08080;}
.company{display:flex;align-items:center;gap:9px;font-size:1.12rem;font-weight:700;}
.company span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.company.none{color:var(--dim);font-style:italic;font-weight:600;font-size:.95rem;}
.logo{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:900;flex-shrink:0;letter-spacing:-.03em;overflow:hidden;}
.logo.lg{width:38px;height:38px;font-size:.88rem;border-radius:9px;}
.agebox{position:absolute;right:11px;top:9px;text-align:right;}
.agebox .lbl{font-size:.48rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
.agebox .val{font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums;}
.agebox .val.money{font-size:.88rem;color:var(--money);}

.repbox{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:11px;}
.repbox .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.repbox .lbl{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.repbox .verdict{font-size:.76rem;font-weight:800;}
.repbox .track{height:7px;background:#232927;border-radius:4px;overflow:hidden;}
.repbox .track .fill{height:100%;border-radius:4px;transition:width .5s ease,background .5s ease;}
.repbox .scale{display:flex;justify-content:space-between;font-size:.48rem;color:var(--dim);margin-top:4px;letter-spacing:.06em;}

.counters{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;margin-bottom:10px;}
.counter{text-align:center;border-right:1px solid var(--line);}
.counter:last-child{border-right:none;}
.counter .lbl{font-size:.48rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:2px;}
.counter .val{font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums;}

.attrs{display:flex;flex-direction:column;gap:6px;margin-bottom:11px;}
.attr{display:flex;align-items:center;gap:8px;}
.attr .k{width:64px;font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.attr .bar{flex:1;height:5px;background:#232927;border-radius:3px;overflow:hidden;}
.attr .fill{height:100%;border-radius:3px;transition:width .45s ease;}
.attr .num{width:22px;text-align:right;font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--muted);}

.case{min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:11px;flex-wrap:wrap;}
.case .empty{font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.badge{font-size:.55rem;font-weight:700;padding:4px 8px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--amber);}
.badge.bad{color:var(--red);border-color:#3a2024;}

.press{background:#12100f;border:1px solid #2b2422;border-radius:8px;padding:9px 11px;margin-bottom:11px;}
.press .outlet{font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;color:#8a6a5a;margin-bottom:3px;}
.press .head{font-size:.76rem;line-height:1.4;color:#dcc8bc;font-weight:600;}
.press .react{font-size:.6rem;color:var(--dim);margin-top:5px;}

/* decisiones */
.decision h3{font-size:.94rem;font-weight:800;margin-bottom:2px;}
.decision .sub{font-size:.72rem;color:var(--muted);line-height:1.45;margin-bottom:11px;}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.offer{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:11px 9px;text-align:center;cursor:pointer;transition:.14s;display:flex;flex-direction:column;}
.offer:hover{border-color:var(--money);background:#1d2521;transform:translateY(-2px);}
.offer.risky:hover{border-color:var(--red);background:#251a1c;}
.offer.cross{border-color:#4a3a20;}
.offer.cross:hover{border-color:var(--amber);background:#252016;}
.offer.blocked{opacity:.3;cursor:not-allowed;}
.offer.blocked:hover{transform:none;border-color:var(--line);background:var(--panel-2);}
.offer .kicker{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.offer .ttl{font-size:.84rem;font-weight:700;margin:2px 0 8px;line-height:1.25;}
.offer .scene{height:74px;border-radius:7px;overflow:hidden;margin-bottom:8px;background:#10130f;}
.offer .scene svg{width:100%;height:100%;display:block;}
.offer .sig{height:40px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.offer .foot{font-size:.54rem;color:var(--muted);margin-top:auto;padding-top:6px;}
.offer .foot .sep{color:var(--dim);margin:0 4px;}
.chips{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:20px;padding:4px 9px;font-size:.55rem;font-weight:700;line-height:1.3;}
.chip b{white-space:nowrap;font-size:.53rem;}
.chip.good{background:#132a1c;color:#5fd07f;}
.chip.bad{background:#2a1418;color:#e07a86;}
.chip.neutral{background:#22282a;color:var(--muted);}
.chip.warn{background:#2a2414;color:var(--amber);}
.chip b{font-variant-numeric:tabular-nums;}
.offer.stay{grid-column:span 2;}
@media(max-width:520px){.offers{grid-template-columns:1fr;}.offer.stay{grid-column:span 1;}}

/* timeline rediseñado (versión normal/intensa) */
.timeline{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;}
.thead,.row{display:grid;grid-template-columns:42px 1fr 34px 34px 32px 46px;gap:5px;padding:6px 9px;align-items:center;}
.thead{font-size:.46rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);}
.thead span:nth-child(n+3){text-align:center;}
.rows{flex:1;overflow-y:auto;max-height:580px;}
.row{font-size:.73rem;border-bottom:1px solid #202624;animation:sl .28s ease both;}
@keyframes sl{from{opacity:0;transform:translateX(-7px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.row{animation:none;}}
.row.ghost{opacity:.15;}
.row.now{background:#1f2622;}
.row .age{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.67rem;}
.row .co{display:flex;align-items:center;gap:6px;overflow:hidden;}
.row .co>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .co .logo{width:15px;height:15px;font-size:.44rem;border-radius:4px;}
.row .marks{display:flex;gap:2px;margin-left:3px;flex-shrink:0;font-size:.64rem;}
.row .rank{text-align:center;font-size:.55rem;font-weight:800;letter-spacing:.04em;}
.row .ov{text-align:center;font-weight:800;font-size:.68rem;border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums;}
.row .rp{text-align:center;font-weight:800;font-size:.66rem;border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums;}
.row .cap{text-align:center;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;}

/* timeline ultra limpio y atractivo para modo exprés */
body.pace-exp .timeline { background: transparent; border: none; }
body.pace-exp .thead { display: none; }
body.pace-exp .rows { display: flex; flex-direction: column; gap: 6px; max-height: 600px; overflow-y: auto; padding-right: 4px; }
body.pace-exp .row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: .75rem; border-bottom: 1px solid var(--line);
}
body.pace-exp .row.ghost { display: none; }
body.pace-exp .row .age { font-weight: 700; color: var(--dim); font-size: .65rem; min-width: 32px; text-align: left; }
body.pace-exp .row .co { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0 8px; }
body.pace-exp .row .co span { font-weight: 700; color: var(--ink); }
body.pace-exp .row .postag { background: #232d29; color: var(--blue); font-size: .48rem; padding: 2px 5px; border-radius: 4px; }
body.pace-exp .row .ov { background: transparent !important; color: var(--money); font-weight: 900; font-size: .8rem; min-width: 36px; text-align: right; }
body.pace-exp .row .rank, body.pace-exp .row .rp, body.pace-exp .row .cap, body.pace-exp .row .marks { display: none; }

/* setup */
.setup h2{font-size:1.1rem;font-weight:800;margin-bottom:13px;}
.setupgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1fr);gap:14px;}
@media(max-width:900px){.setupgrid{grid-template-columns:1fr 1fr;}.setupgrid .col:nth-child(3){grid-column:span 2;}}
@media(max-width:600px){.setupgrid{grid-template-columns:1fr;}.setupgrid .col:nth-child(3){grid-column:span 1;}}
.col>h4{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:10px;}
.avatar{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;margin-bottom:10px;}
.avatar .frame{width:112px;height:120px;margin:0 auto 8px;border-radius:12px;background:linear-gradient(165deg,#2a322e,#171c1a);border:1px solid var(--line);overflow:hidden;}
.avatar .frame svg{width:100%;height:100%;display:block;}
.avatar .nm{font-size:.72rem;font-weight:800;letter-spacing:.05em;}
.avatar .rl{font-size:.53rem;color:var(--muted);margin-top:1px;}
.field{margin-bottom:9px;}
.field label{display:block;font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.field input{width:100%;background:#111513;border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 10px;font-family:inherit;font-size:.82rem;font-weight:700;text-align:center;}
.field input:focus{outline:none;border-color:var(--money);}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.toggle.three{grid-template-columns:1fr 1fr 1fr;}
.toggle button{background:#111513;border:1px solid var(--line);border-radius:7px;color:var(--muted);padding:9px 3px;font-family:inherit;font-size:.68rem;font-weight:700;cursor:pointer;transition:.14s;}
.toggle button.on{background:var(--ink);color:#0c0e0d;border-color:var(--ink);}
.toggle button.on.izq{background:var(--red);color:#fff;border-color:var(--red);}
.toggle button.on.der{background:var(--money);color:#0c0e0d;border-color:var(--money);}
.toggle .hint{grid-column:1/-1;font-size:.55rem;color:var(--dim);text-align:center;margin-top:2px;line-height:1.4;}
.origins{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.origin{display:flex;align-items:flex-start;gap:9px;padding:10px;border-radius:7px;border:1px solid transparent;cursor:pointer;transition:.14s;}
.origin:hover{background:#232b28;}
.origin.on{background:#1a2320;border-color:var(--money);}
.origin .ic{font-size:1.05rem;width:20px;text-align:center;flex-shrink:0;line-height:1.3;}
.origin .tx{flex:1;min-width:0;}
.origin .tx b{display:block;font-size:.76rem;font-weight:700;margin-bottom:2px;}
.origin .tx small{font-size:.6rem;color:var(--muted);line-height:1.4;display:block;}
.origin .ck{color:var(--money);font-weight:900;opacity:0;flex-shrink:0;}
.origin.on .ck{opacity:1;}
.floor{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:20px 10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:relative;}
.floor::before{content:"DIRECTORIO";position:absolute;top:6px;left:0;right:0;text-align:center;font-size:.42rem;letter-spacing:.2em;color:var(--dim);}
.slot{border:1px solid var(--line);border-radius:6px;background:#111513;padding:10px 2px;text-align:center;font-size:.58rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.14s;}
.slot:hover{border-color:var(--muted);color:var(--ink);}
.slot.on{background:var(--ink);color:#0c0e0d;border-color:var(--ink);}
.slot.wide{grid-column:span 3;}
.setupfoot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:13px;border-top:1px solid var(--line);}

.btn{background:var(--money);color:#0c0e0d;border:none;border-radius:7px;padding:11px 24px;font-family:inherit;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.14s;}
.btn:hover{filter:brightness(1.12);}
.btn:disabled{background:#2a312e;color:var(--dim);cursor:not-allowed;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.btn:focus-visible,.offer:focus-visible,.origin:focus-visible,.slot:focus-visible{outline:2px solid var(--money);outline-offset:2px;}
.landing{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;align-items:center;padding:14px 8px;}
@media(max-width:760px){.landing{grid-template-columns:1fr;gap:18px;}}
.landing .art{border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.landing .art svg{width:100%;height:100%;display:block;}
.landing .eyebrow{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.landing h2{font-size:2.05rem;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin-bottom:10px;}
@media(max-width:760px){.landing h2{font-size:1.6rem;}}
.landing p{font-size:.84rem;color:var(--muted);line-height:1.6;margin-bottom:16px;max-width:420px;}
.paces{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.pace{background:#1c2320;border:1px solid var(--line);color:var(--muted);border-radius:22px;padding:9px 20px;font-family:inherit;font-size:.76rem;font-weight:700;cursor:pointer;transition:.14s;}
.pace:hover{color:var(--ink);border-color:var(--muted);}
.pace.on{background:var(--ink);color:#0c0e0d;border-color:var(--ink);}
.pacehint{font-size:.66rem;color:var(--dim);margin-bottom:18px;}
.intro{text-align:center;padding:36px 18px;}
.intro p{color:var(--muted);font-size:.84rem;line-height:1.65;max-width:430px;margin:0 auto 18px;}
.intro .big{font-size:1.4rem;font-weight:800;margin-bottom:8px;}

.endcard{text-align:center;padding:4px 0 10px;}
.endcard .stamp{display:inline-block;font-size:.56rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin-bottom:9px;}
.endcard .verdict{font-size:1.05rem;font-weight:800;margin-bottom:5px;}
.endcard .obit{font-size:.79rem;color:var(--muted);line-height:1.55;font-style:italic;padding:0 6px;}
.netfinal{font-size:1.95rem;font-weight:900;color:var(--money);font-variant-numeric:tabular-nums;margin:8px 0 2px;}
.netfinal.bad{color:var(--red);}
.netlbl{font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:11px;}
.footnote{max-width:1120px;margin:12px auto 0;text-align:center;font-size:.54rem;color:var(--dim);line-height:1.5;}

/* ---- competencias y puestos ---- */
.compbox{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
.compbox h5{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;text-align:center;}
.comprow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.comprow .k{width:74px;font-size:.55rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.comprow .bar{flex:1;height:6px;background:#232927;border-radius:3px;overflow:hidden;}
.comprow .fill{height:100%;border-radius:3px;transition:width .4s ease;}
.comprow .bd{width:52px;text-align:right;font-size:.53rem;font-weight:800;letter-spacing:.03em;}
.compnote{font-size:.55rem;color:var(--dim);line-height:1.45;margin-top:8px;text-align:center;}

.postag{font-size:.5rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:3px;background:#252b29;color:var(--muted);flex-shrink:0;}
.offer .post{display:flex;align-items:center;justify-content:center;gap:5px;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.offer .post b{color:var(--ink);font-size:.6rem;letter-spacing:.06em;}
.chip.fit-alto{background:#132a1c;color:#5fd07f;}
.chip.fit-medio{background:#252a18;color:#b0c060;}
.chip.fit-bajo{background:#2a2214;color:#e0a030;}
.chip.fit-nulo{background:#2a1418;color:#e07a86;}
.chip.rumor{background:#1c2028;color:#8a9aa8;font-style:italic;}
.perfbox{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:11px;}
.perfbox .lbl{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex-shrink:0;}
.perfbox .track{flex:1;height:6px;background:#232927;border-radius:3px;overflow:hidden;}
.perfbox .fill{height:100%;border-radius:3px;transition:width .4s ease;}
.perfbox .v{font-size:.62rem;font-weight:800;flex-shrink:0;}
.warnbox{background:#2a1418;border:1px solid #4a2028;border-radius:8px;padding:9px 11px;margin-bottom:11px;font-size:.72rem;color:#e0a0a8;line-height:1.4;}
.warnbox b{color:#f0c0c8;}
/* ---- resultados de cada opción ---- */
.outcomes{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.outcome{background:#151a18;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;}
.outcome.cross-note{background:#1e1a10;border-color:#4a3a20;}
.oc-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:4px;}
.oc-head span{font-size:.58rem;font-weight:700;color:var(--ink);line-height:1.3;}
.oc-head b{font-size:.6rem;font-variant-numeric:tabular-nums;color:var(--muted);flex-shrink:0;}
.oc-mets{display:flex;flex-wrap:wrap;gap:4px;}
.met{font-size:.5rem;font-weight:800;padding:2px 6px;border-radius:10px;letter-spacing:.02em;}
.met.up{background:#13291b;color:#5fd07f;}
.met.down{background:#2a1418;color:#e08a94;}

/* ---- contador de OVR ---- */
.ovrblock{transition:box-shadow .3s ease;}
.ovrblock.rising{box-shadow:0 0 0 2px #3fb950, 0 0 22px rgba(63,185,80,.5);}
.ovrblock.falling{box-shadow:0 0 0 2px #d1495b, 0 0 22px rgba(209,73,91,.5);}
.ovrblock b{transition:transform .12s ease;}
.ovrblock.ticking b{transform:scale(1.14);}

/* ---- destello del resultado ---- */
.flash{border-radius:10px;padding:10px 12px;margin-bottom:11px;animation:flashIn .45s cubic-bezier(.2,1.4,.4,1) both;}
.flash.good{background:linear-gradient(100deg,#16301f,#101a14);border:1px solid #2c6b3c;}
.flash.bad{background:linear-gradient(100deg,#301a1e,#1a1013);border:1px solid #6b2c36;}
.flash .fh{font-size:.78rem;font-weight:800;margin-bottom:5px;}
.flash.good .fh{color:#7fe09c;}
.flash.bad .fh{color:#f0909c;}
.flash .fm{display:flex;flex-wrap:wrap;gap:5px;}
.flash .met{font-size:.55rem;padding:3px 8px;}
@keyframes flashIn{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.flash{animation:none;}}

/* ---- click con respuesta ---- */
.offer{position:relative;}
.offer:active{transform:scale(.975);}
.offer.chosen{border-color:var(--money);background:#1e2822;animation:pick .3s ease;}
@keyframes pick{0%{transform:scale(1);}45%{transform:scale(1.03);}100%{transform:scale(1);}}
/* ---- overlay de hito ---- */
.overlay{position:fixed;inset:0;background:rgba(6,8,7,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;
  animation:ovIn .25s ease both;}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.mile{max-width:340px;width:100%;border-radius:16px;padding:26px 22px 20px;text-align:center;
  border:1px solid var(--line);background:linear-gradient(165deg,#1e2422,#12100f);
  animation:mileIn .5s cubic-bezier(.2,1.5,.4,1) both;position:relative;overflow:hidden;}
@keyframes mileIn{from{opacity:0;transform:translateY(24px) scale(.9);}to{opacity:1;transform:none;}}
.mile.good{border-color:#2c6b3c;box-shadow:0 0 50px rgba(63,185,80,.24);}
.mile.bad{border-color:#6b2c36;box-shadow:0 0 50px rgba(209,73,91,.24);}
.mile.gold{border-color:#8a6a20;box-shadow:0 0 60px rgba(201,162,39,.3);}
.mile .rays{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 12%,rgba(255,255,255,.05) 12% 14%,transparent 14% 26%,rgba(255,255,255,.05) 26% 28%,transparent 28%);
  animation:spin 18s linear infinite;pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.mile .ic{font-size:2.6rem;line-height:1;margin-bottom:10px;position:relative;}
.mile .kick{font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;position:relative;}
.mile h3{font-size:1.5rem;font-weight:900;letter-spacing:-.01em;margin-bottom:4px;position:relative;}
.mile .sub{font-size:.76rem;color:var(--muted);line-height:1.5;margin-bottom:16px;position:relative;}
.mile .badge2{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;margin-bottom:14px;position:relative;}
.mile .btn{width:100%;position:relative;}
@media(prefers-reduced-motion:reduce){.mile,.overlay{animation:none;}.mile .rays{animation:none;}}

/* ---- ruleta de resultado ---- */
.rolling-note{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);
  text-align:center;margin-bottom:9px;animation:pulse 1s ease infinite;}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.outcome.lit{transform:scale(1.03);}
.outcome.lit.win{background:#15301f;border-color:#3fb950;box-shadow:0 0 18px rgba(63,185,80,.35);}
.outcome.lit.lose{background:#301519;border-color:#d1495b;box-shadow:0 0 18px rgba(209,73,91,.35);}
.outcome{transition:transform .1s ease,background .1s ease,border-color .1s ease,box-shadow .1s ease;}
.offer.spinning{border-color:var(--amber);}
/* ---- cabecera compacta ---- */
.avatarbox{cursor:pointer;transition:.15s;}
.avatarbox:hover{border-color:var(--money);}
.avatarbox .tap{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:.4rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}
.hero-money{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;
  margin-bottom:11px;display:flex;align-items:baseline;justify-content:space-between;}
.hero-money .lbl{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.hero-money .val{font-size:1.5rem;font-weight:900;color:var(--money);font-variant-numeric:tabular-nums;}
.hero-money .val.bad{color:var(--red);}
.hero-money .age{font-size:.68rem;color:var(--muted);}
.hero-money .val.salsm{font-size:1.05rem;color:var(--ink);}
.offer .sal{font-size:.68rem;font-weight:800;color:var(--money);text-align:center;margin-top:6px;}
.offer .sal small{display:block;font-size:.5rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;}
.offer .sal.down{color:var(--red);}
.miniline{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:.62rem;color:var(--muted);margin-bottom:10px;padding:0 2px;}
.miniline b{color:var(--ink);}
.miniline .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}

/* ---- popup de stats ---- */
.statspop{max-width:300px;width:100%;border-radius:14px;padding:18px 18px 16px;
  background:linear-gradient(165deg,#1e2422,#12100f);border:1px solid var(--line);
  animation:mileIn .3s ease both;}
.statspop h4{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;text-align:center;}
.statspop .row2{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.statspop .row2 .k{width:76px;font-size:.62rem;color:var(--muted);}
.statspop .row2 .bar{flex:1;height:6px;background:#232927;border-radius:3px;overflow:hidden;}
.statspop .row2 .fill{height:100%;border-radius:3px;}
.statspop .row2 .n{width:24px;text-align:right;font-size:.68rem;font-weight:700;color:var(--ink);}
.statspop .div{height:1px;background:var(--line);margin:12px 0;}
.statspop .close{width:100%;}

/* ---- tarjetas de decisión simplificadas ---- */
.outcome{padding:8px 9px;}
.oc-big{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:4px;}
.oc-big .num{font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums;}
.oc-big .num.up{color:#5fd07f;}
.oc-big .num.down{color:#e08a94;}
.oc-minor{font-size:.5rem;color:var(--dim);text-align:center;line-height:1.4;}
.axis-tag{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:2px 7px;
  border-radius:10px;display:inline-block;margin-bottom:6px;}
.axis-tag.ovr{background:#1a2838;color:#7fb2e0;}
.axis-tag.cash{background:#1a2e20;color:#7fd0a0;}

/* ---- MODO EXPRÉS (Reducción de carga cognitiva) ---- */
body.pace-exp .oc-minor { display: none !important; }
body.pace-exp .oc-head b { display: none !important; }
body.pace-exp .axis-tag { display: none !important; }
body.pace-exp .counters { display: none !important; }
body.pace-exp .rolling-note { display: none !important; }
</style>

let S=null;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const rndInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(n,max=99)=>Math.max(0,Math.min(max,Math.round(n)));
function money(v){const a=Math.abs(v),s=v<0?"-":"";
  if(a>=1e9)return s+"$"+(a/1e9).toFixed(1)+"MM";
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(1)+"M";
  if(a>=1e3)return s+"$"+(a/1e3).toFixed(0)+"K";
  return s+"$"+Math.round(a);}
function capF(v){return v>=1000?"$"+(v/1000).toFixed(1)+"MM":v>=1?"$"+v.toFixed(0)+"M":"$"+(v*1000).toFixed(0)+"K";}
function ovrColor(o){return o>=88?"#c9a227":o>=76?"#3fb950":o>=62?"#8a9c3f":o>=48?"#e0a030":"#7a6a55";}
function repColor(r){return r>=75?"#3fb950":r>=55?"#8a9c3f":r>=40?"#e0a030":r>=20?"#e05f30":"#d1495b";}
function rankColor(i){return ["#5a6a64","#5a6a64","#5f8a9c","#5f8a9c","#8a9c3f","#3fb950","#c9a227","#e0b830","#f0d060"][i]||"#5a6a64";}

function logo(co,cls){
  if(!co) return `<div class="logo ${cls||''}" style="background:#232927;color:var(--dim)">?</div>`;
  if(co.img) return `<div class="logo ${cls||''}" style="background:#fff"><img src="${co.img}" alt="" style="width:100%;height:100%;object-fit:contain"></div>`;
  const id="lg"+co.ini.replace(/[^A-Za-z0-9]/g,"")+(co.t||0);
  return `<div class="logo ${cls||''}" style="background:none">
    <svg viewBox="0 0 40 40" style="width:100%;height:100%;display:block">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${co.c1}"/><stop offset="1" stop-color="${co.c2}"/></linearGradient></defs>
      <g fill="url(#${id})">${SHAPES[co.sh]||SHAPES.sq}</g>
      <text x="20" y="26" text-anchor="middle" font-family="Inter,sans-serif" font-size="15"
        font-weight="900" fill="#0c0e0d" opacity=".92">${co.ini}</text>
    </svg></div>`;
}
function fitBand(c){
  if(c>=58) return {k:"alto", l:"Es lo tuyo"};
  if(c>=38) return {k:"medio", l:"Te las arreglás"};
  if(c>=20) return {k:"bajo", l:"Te queda grande"};
  return {k:"nulo", l:"No tenés idea"};
}
function computeOvr(){
  const s=S.stats;
  const c=S.area?S.comp[S.area]:20;
  return clamp(26 + c*.35 + s.vision*.12 + s.ejecucion*.12 + s.carisma*.10 + s.rosca*.11 + S.tierBonus);
}
function previewOvr(area,tier){
  const s=S.stats, c=S.comp[area];
  const tb=Math.min((tier-1)*4,34);
  return clamp(26 + c*.35 + s.vision*.12 + s.ejecucion*.12 + s.carisma*.10 + s.rosca*.11 + tb);
}
const CAP_REF=[1,38,2500,300000,3000000];
function salaryFor(co,area,rank){
  const base=13000*Math.pow(3.25,co.t-1);
  const capMult=Math.max(.65,Math.min(1.7,Math.pow(co.cap/(CAP_REF[co.t-1]||1),.22)));
  const rankMult=1+rank.i*.17;
  const fit=.72+(S.comp[area]/100)*.55;
  const repMult=.82+S.rep/260;
  return Math.round(base*capMult*rankMult*fit*repMult);
}
function ovrDelta(eff){
  if(!eff) return 0;
  return Math.round((eff.ovr||0) + (eff.vision||0)*.12 + (eff.ejecucion||0)*.12
    + (eff.carisma||0)*.10 + (eff.rosca||0)*.11);
}
function metrics(rl){
  const e=rl.eff||{}, m=[];
  const d=ovrDelta(e);
  if(d) m.push({t:`${d>0?'+':''}${d} OVR`, c:d>0?'up':'down'});
  if(e.rep) m.push({t:`${e.rep>0?'+':''}${e.rep} reputación`, c:e.rep>0?'up':'down'});
  if(e.riesgo) m.push({t:`${e.riesgo>0?'+':''}${e.riesgo} riesgo legal`, c:e.riesgo>0?'down':'up'});
  if(rl.cash) m.push({t:`${rl.cash>0?'+':''}${money(rl.cash)}`, c:rl.cash>0?'up':'down'});
  if(rl.cashMult) m.push({t:`+${(rl.cashMult*100).toFixed(0)}% del valor`, c:'up'});
  if(rl.cap) m.push({t:`${rl.cap>0?'+':''}${Math.round(rl.cap*100)}% la empresa`, c:rl.cap>0?'up':'down'});
  if(rl.layoffs) m.push({t:"despidos masivos", c:'down'});
  if(rl.ipo) m.push({t:"sale a bolsa", c:'up'});
  if(rl.exit) m.push({t:"exit", c:'up'});
  return m;
}
function splitMetrics(rl){
  const all=metrics(rl), headline=[], minor=[];
  all.forEach(m=>{
    const money = m.t.startsWith("+$")||m.t.startsWith("-$")||m.t.includes("% del valor")||m.t.includes("% la empresa");
    if(m.t.includes("OVR")||money) headline.push(m); else minor.push(m);
  });
  return {headline,minor};
}
function axisTag(o){
  let ovrSum=0,cashSum=0;
  o.roll.forEach(rl=>{
    ovrSum+=Math.abs(ovrDelta(rl.eff));
    let c=0;
    if(rl.cash) c+=Math.abs(rl.cash)/18000;
    if(rl.cashMult) c+=rl.cashMult*110;
    if(rl.cap) c+=Math.abs(rl.cap)*38;
    cashSum+=c;
  });
  if(cashSum>ovrSum*1.15) return {cls:"cash",label:"Juego de plata"};
  if(ovrSum>cashSum*1.15) return {cls:"ovr",label:"Juego de gestión"};
  return null;
}
function rankOf(o){
  let r=RANKS[0],i=0;
  RANKS.forEach((x,j)=>{if(o>=x.min){r=x;i=j;}});
  const out={...r,i};
  if(i===6 && S && S.area && CSUITE[S.area]){
    out.n=CSUITE[S.area].n; out.s=CSUITE[S.area].s; out.full=CSUITE[S.area].full;
  }
  if(S && S.esCEO && i>=6){ out.n="CEO"; out.s="CEO"; out.full="Chief Executive Officer"; }
  return out;
}

/* ================= FLUJO ================= */
function initSetup(){ S={phase:"setup",gender:"H",apellido:"",lane:null,origin:null,pace:PACE}; render(); }

function startCareer(){
  const o=ORIGINS.find(x=>x.id===S.origin);
  const st={...o.stats};
  const comp={};
  for(const k in o.comp) comp[k]=clamp(o.comp[k]+rndInt(-7,7));
  for(const k in st) st[k]=clamp(st[k]+rndInt(-3,3));
  S={...S, phase:"offer", stats:st, comp,
    area:null, riesgo:S.lane==="izq"?12:4, rep:o.rep-(S.lane==="izq"?6:0),
    vigencia:100, extensiones:0, shockYear:-99, lastEventAge:-99,
    tierBonus:0, age:22, cash:o.cash, salary:18000,
    company:null, rows:[], awards:[], layoffs:0, rounds:0, exits:0, sinceMarket:0,
    perf:50, badYears:0, press:null, warn:null, choice:null, flash:null, displayOvr:0, esCEO:false, milestones:[],
    blockStart:23, blockYears:0, pendingMarks:[],
    ended:false, endReason:null, endApplied:false, fired:false,
    maxOvr:0, maxRank:null, empresasFundidas:0,
    rank:rankOf(0), offers:makeOffers(1,3)};
  S.rank=rankOf(computeOvr());
  S.displayOvr=computeOvr();
  render();
}

function makeOffers(tier,n,exclude){
  let pool=COMPANIES.filter(c=>c.t===tier&&(!exclude||c.n!==exclude.n));
  if(pool.length<n) pool=COMPANIES.filter(c=>c.t<=tier&&(!exclude||c.n!==exclude.n));
  const out=[];
  while(out.length<n&&pool.length){
    const co=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const salud=rndInt(25,95);
    const real=salud>=65?"bien":salud>=42?"regular":"mal";
    const shown=Math.random()<.25 ? rnd(["bien","regular","mal"]) : real;
    out.push({...co, area:rnd(co.areas), salud, rumor:rnd(RUMORS[shown])});
  }
  return out;
}
function accessibleTier(){
  const o=computeOvr();
  const repCap=S.rep<18?2:S.rep<32?3:4;
  const vigCap=S.vigencia<20?1:S.vigencia<40?2:S.vigencia<60?3:5;
  const byOvr=o>=76?4:o>=58?3:o>=38?2:1;
  const base=Math.min(byOvr,repCap,vigCap);
  if(S.extensiones>=1&&o>=84&&S.vigencia>=55) return 5;
  return Math.max(1,base);
}
function pickCompany(i){
  S.flash=null;
  if(i===-1&&!S.company) i=0;
  if(i===-1){
    const otras=S.company.areas.filter(a=>a!==S.area);
    if(otras.length && Math.random()<.28){
      const nueva=rnd(otras);
      S.warn=`<b>Reestructuración.</b> ${S.company.n} disolvió tu área y te reubicó en ${areaById(nueva).n.toLowerCase()}. No te preguntaron.`;
      S.area=nueva; S.badYears=0;
    } else S.warn=null;
  }
  if(i!==-1){
    const c=S.offers[i];
    S.company={...c};
    S.area=c.area;
    S.tierBonus=(c.t-1)*4;
    const rankNow=rankOf(computeOvr());
    S.salary=salaryFor(S.company,S.area,rankNow);
    S.badYears=0; S.fired=false; S.warn=null;
  }
  S.sinceMarket=0;
  S.blockStart=S.age+1; S.blockYears=0; S.pendingMarks=[];
  S.rank=rankOf(computeOvr());
  advanceYear();
}

function trackPeaks() {
  const currentOvr = computeOvr();
  if (currentOvr > S.maxOvr) S.maxOvr = currentOvr;
  if (!S.maxRank || S.rank.i > S.maxRank.i) S.maxRank = S.rank;
}

function advanceYear(){
  S.age++; S.sinceMarket++;
  const marks=[];

  const c=S.comp[S.area];
  const gen=(S.stats.vision+S.stats.ejecucion+S.stats.carisma+S.stats.rosca)/4;
  const exigencia=S.company.t*6 + S.rank.i*1.5;
  const suerte=rndInt(-12,12);
  S.perf=clamp(28 + c*.60 + gen*.45 + suerte - exigencia);

  if(S.perf>=58){
    S.comp[S.area]=clamp(S.comp[S.area]+(S.perf>=72?rndInt(3,6):rndInt(1,3)));
    S.stats.ejecucion=clamp(S.stats.ejecucion+rndInt(1,2));
    if(S.perf>=72){ S.rep=clamp(S.rep+2); S.stats.vision=clamp(S.stats.vision+1); }
    if(S.perf>=74){ S.tierBonus=clamp(S.tierBonus+1,34); S.stats.rosca=clamp(S.stats.rosca+1); }
    S.badYears=0;
  }else if(S.perf>=34){
    S.comp[S.area]=clamp(S.comp[S.area]+rndInt(0,2));
    S.badYears=0;
  }else{
    S.badYears++;
    marks.push("🔻");
    S.rep=clamp(S.rep-1.5);
  }

  for(const k in S.comp){ if(k!==S.area) S.comp[k]=Math.max(0,S.comp[k]-0.32); }

  const g=S.lane==="izq"?1.2:1;
  S.stats.vision=clamp(S.stats.vision+Math.round(rndInt(0,2)*g));
  S.stats.carisma=clamp(S.stats.carisma+rndInt(0,2));
  S.stats.rosca=clamp(S.stats.rosca+Math.round(rndInt(0,2)*g));
  S.riesgo=clamp(S.riesgo+(S.lane==="izq"?rndInt(0,2):-1));
  S.rep=clamp(S.rep+(S.rep<45?1.6:-.3));
  if(S.age>52) S.vigencia=clamp(S.vigencia-(0.8+(S.age-52)*0.06));
  if(S.rep>78) S.vigencia=clamp(S.vigencia+1);

  const salaryTarget=salaryFor(S.company,S.area,S.rank);
  S.salary=Math.round(S.salary*.6 + salaryTarget*.4);
  S.salary=Math.round(S.salary*(1+.02+S.perf/2200));
  S.cash+=S.salary*Math.max(.12,(.50-S.rank.i*.035)+Math.random()*.18);

  S.company.salud=clamp(S.company.salud + rndInt(-7,6) + (S.perf-50)/12);
  const drift=(S.perf-50)/420+(S.company.salud-50)/700+(Math.random()-.45)*.12;
  S.company.cap=Math.max(.05,S.company.cap*(1+drift));

  if(Math.random()<.12){S.rounds++;S.company.cap*=1.28;marks.push("💵");}
  if(Math.random()<.07){S.layoffs++;marks.push("✂️");S.stats.carisma=clamp(S.stats.carisma-3);S.rep=clamp(S.rep-6);}
  if(Math.random()<.045&&computeOvr()>68&&!S.awards.includes("forbes")){S.awards.push("forbes");S.rep=clamp(S.rep+8);marks.push("📰");}
  if(S.company.cap>1000&&S.company.t<=2&&!S.awards.includes("unicornio")){S.awards.push("unicornio");S.rep=clamp(S.rep+6);marks.push("🦄");}
  if(S.rep>=88&&!S.awards.includes("querido"))S.awards.push("querido");
  if(S.rep<=12&&!S.awards.includes("odiado"))S.awards.push("odiado");

  const prevRank=S.rank.i;
  const prevName=S.rank.n;
  S.rank=rankOf(computeOvr());
  trackPeaks();

  if(S.rank.i>prevRank){
    marks.push("⬆️");
    const c=S.rank.i>=6;
    pushMilestone({
      tone:c?"gold":"good", ic:c?"👑":"⬆️",
      kick:c?"Llegaste a la franja C":"Ascenso",
      title:S.rank.n,
      badge:S.rank.band||null, badgeBg:"#2e2416", badgeCol:"#e0b860",
      sub:c?`${S.rank.full||S.rank.n} de ${S.company.n}. Arriba tuyo ya casi no queda nadie, y todo lo que pase de acá en adelante lleva tu firma.`
           :`Pasaste de ${prevName.toLowerCase()} a ${S.rank.n.toLowerCase()} en ${S.company.n}. Más sueldo, más exigencia y menos excusas.`,
      cta:"Seguir"});
  }

  if(S.age-S.shockYear>6){
    const sh=rollShock();
    if(sh){
      S.shockYear=S.age;
      applyEff(sh.eff); if(sh.cash) S.cash+=sh.cash;
      marks.push(sh.mark); S.rank=rankOf(computeOvr());
      S.press={outlet:rnd(OUTLETS),head:sh.head,react:sh.react};
    }
  }

  S.pendingMarks.push(...marks);
  S.blockYears++;

  if(S.riesgo>=80&&Math.random()<(S.riesgo-72)/100){ flushRow(); return endGame("carcel"); }
  if(S.cash<-1200000){ flushRow(); return endGame("bancarrota"); }
  if(S.rep<=4&&Math.random()<.10){ flushRow(); return endGame("cancelado"); }
  if(S.vigencia<=4){ flushRow(); return endGame("obsolescencia"); }
  if(S.age>=RETIRE_AGES[Math.min(S.extensiones,RETIRE_AGES.length-1)]){ flushRow(); S.phase="longevity"; render(); return; }

  const crisis = S.company.salud<=20 && Math.random()<.45;
  if(S.badYears>=3 || crisis){ flushRow(); return fireEmployee(crisis); }

  const cad={int:1,nor:2,exp:4}[S.pace];
  if(S.blockYears>=cad){ flushRow(); return nextDecision(); }
  return advanceYear();
}
function applyEff(eff){
  for(const k in (eff||{})){
    if(k==="ovr") S.tierBonus=clamp(S.tierBonus+eff.ovr,34);
    else if(k==="riesgo") S.riesgo=clamp(S.riesgo+eff.riesgo);
    else if(k==="rep") S.rep=clamp(S.rep+eff.rep);
    else if(k==="vigencia") S.vigencia=clamp(S.vigencia+eff.vigencia);
    else if(S.stats[k]!==undefined) S.stats[k]=clamp(S.stats[k]+eff[k]);
  }
}
function rollShock(){
  const pool=SHOCKS.filter(s=>S.age>=s.min&&(!s.needRiesgo||S.riesgo>=s.needRiesgo)&&(!s.needLayoffs||S.layoffs>=s.needLayoffs));
  for(const s of pool){ if(Math.random()<s.p) return s; }
  return null;
}
function fireEmployee(crisis){
  if(crisis) S.empresasFundidas++; 
  S.fired=true; S.badYears=0;
  S.rep=clamp(S.rep-(crisis?4:10));
  S.tierBonus=clamp(S.tierBonus-4,30);
  const last=S.rows[S.rows.length-1];
  if(last) last.marks.push("🚪");
  S.blockStart=S.age+1; S.blockYears=0; S.pendingMarks=[];
  pushMilestone(crisis
    ? {tone:"bad", ic:"🏚️", kick:"Se cayó la empresa", title:S.company.n,
       badge:"Fin del área", badgeBg:"#2a1418", badgeCol:"#e08a94",
       sub:"Entró en crisis y desarmó tu área. No fue tu culpa, pero el que se queda sin puesto sos vos.", cta:"Buscar trabajo"}
    : {tone:"bad", ic:"🚪", kick:"Te echaron", title:"Fin del ciclo",
       badge:areaById(S.area).n, badgeBg:"#2a1418", badgeCol:"#e08a94",
       sub:`Tres años flojos en ${areaById(S.area).n.toLowerCase()} y el board decidió que el problema eras vos.`, cta:"Buscar trabajo"});
  S.warn = crisis
    ? `<b>La empresa se cayó.</b> ${S.company.n} entró en crisis y desarmó tu área. No es tu culpa, pero el que se queda sin puesto sos vos.`
    : `<b>Te echaron.</b> Tres años flojos en ${areaById(S.area).n.toLowerCase()} y el board decidió que el problema eras vos.`;
  const t=Math.max(1, accessibleTier()-1);
  S.offers=makeOffers(t,3,S.company);
  S.company=null; S.area=null; S.sinceMarket=0;
  S.phase="offer"; render();
}
function flushRow(){
  if(!S.blockYears) return;
  S.rows.push({age:S.blockStart, years:S.blockYears, co:S.company, area:S.area,
    rank:S.rank, ovr:computeOvr(), cap:S.company?S.company.cap:0,
    rep:Math.round(S.rep), perf:S.perf, marks:S.pendingMarks});
  S.blockStart=S.age+1; S.blockYears=0; S.pendingMarks=[];
}

function renderSparkline() {
  if (!S.rows || S.rows.length < 2) return '';
  const maxOvr = Math.max(...S.rows.map(r => r.ovr), 1);
  const minOvr = Math.min(...S.rows.map(r => r.ovr), 0);
  const w = 300, h = 40;
  const points = S.rows.map((r, i) => {
    const x = (i / (S.rows.length - 1)) * w;
    const y = h - ((r.ovr - minOvr) / (maxOvr - minOvr || 1)) * h;
    return `${x},${y}`;
  }).join(' ');
  
  return `<svg viewBox="0 -5 300 50" style="width:100%; height:50px; overflow:visible;">
    <polyline points="${points}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function nextDecision(){
  const cad={int:1,nor:2,exp:4}[S.pace];
  const gap=S.age-S.lastEventAge;
  const canEvent = gap>=3+cad;
  const r=Math.random();
  if(canEvent && r<.26){
    const pool=EVENTS.filter(e=>(!e.min||S.age>=e.min)&&(!e.minOvr||computeOvr()>=e.minOvr));
    const elite=pool.filter(e=>e.minOvr);
    const pick = (elite.length && Math.random()<.45) ? rnd(elite) : rnd(pool);
    if(pool.length){ S.choice={kind:"event",...pick}; S.phase="choice"; render(); return; }
  }
  if(canEvent && r<.34){
    const opts=[...FOCI].sort(()=>Math.random()-.5).slice(0,2);
    S.choice={kind:"focus",t:"Foco del período",s:"Todo lo que elijas te va a costar otra cosa.",o:opts};
    S.phase="choice"; render(); return;
  }
  S.offers=makeOffers(accessibleTier(),2,S.company);
  S.phase="offer"; render();
}
function resolveChoice(i){
  S.flash=null;
  const o=S.choice.o[i];
  let r=o.roll[0],acc=0,x=Math.random()*100;
  for(const cand of o.roll){ acc+=cand.p; if(x<=acc){ r=cand; break; } }
  S.rolling={oi:i, ri:o.roll.indexOf(r), cur:0, spins:0};
  S.phase="rolling";
  render();
  spinTick();
}
function spinTick(){
  const R=S.rolling; if(!R) return;
  const o=S.choice.o[R.oi], n=o.roll.length;
  const cards=document.querySelectorAll(".offer.spinning .outcome");
  cards.forEach((c,j)=>{
    c.classList.remove("lit","win","lose");
    if(j===R.cur){
      const d=ovrDelta(o.roll[j].eff);
      c.classList.add("lit", d>=0?"win":"lose");
    }
  });
  R.spins++;
  const total=9+R.ri;
  if(R.spins>total && R.cur===R.ri){
    setTimeout(()=>applyChoice(R.oi,R.ri),600);
    return;
  }
  R.cur=(R.cur+1)%n;
  setTimeout(spinTick, 70+R.spins*R.spins*1.6);
}
function applyChoice(oi,ri){
  const o=S.choice.o[oi], r=o.roll[ri];
  S.rolling=null;
  const cross=o.lane&&o.lane!==S.lane;
  const ovrAntes=computeOvr();
  const mets=metrics(r);
  applyEff(r.eff);
  if(r.cash) S.cash+=r.cash;
  if(r.cashMult&&S.company) S.cash+=S.company.cap*1e6*r.cashMult;
  if(r.cap&&S.company) S.company.cap=Math.max(.05,S.company.cap*(1+r.cap));
  if(r.layoffs) S.layoffs+=r.layoffs;
  if(r.exit){S.exits++; if(!S.awards.includes("exit"))S.awards.push("exit");}
  if(r.ipo&&!S.awards.includes("ipo"))S.awards.push("ipo");
  if(r.oracle&&!S.awards.includes("oraculo"))S.awards.push("oraculo");
  if(r.ceo) S.esCEO=true;
  const last=S.rows[S.rows.length-1];
  if(last){ if(r.mark) last.marks.push(r.mark); last.rep=Math.round(S.rep); if(S.company) last.cap=S.company.cap; }
  if(r.head) S.press={outlet:rnd(OUTLETS),head:r.head,react:reaction(r,o)};
  if(cross){
    S.riesgo=clamp(S.riesgo+14); S.rep=clamp(S.rep-7);
    if(S.press) S.press.react="Te saliste de tu propio libreto y eso, tarde o temprano, alguien lo anota.";
  }
  const dOvr=computeOvr()-ovrAntes;
  S.flash={good:dOvr>=0, title:(o.chips[ri]||{}).l||o.n, mets};
  S.choice=null; S.lastEventAge=S.age;
  
  S.rank=rankOf(computeOvr());
  trackPeaks();
  
  if(S.riesgo>=88&&Math.random()<.35) return endGame("carcel");
  advanceYear();
}
function reaction(r,o){
  const d=(r.eff&&r.eff.rep)||0;
  if(d>=14) return "La opinión pública te acompaña. Por ahora.";
  if(d>=5) return "Buena repercusión, del tipo que no dura.";
  if(d<=-18) return "Los comentarios están imposibles. Ya hay un hilo con capturas.";
  if(d<=-5) return "Repercusión negativa moderada, se olvida en dos semanas.";
  return "Nadie opinó demasiado, que a veces es lo mejor que puede pasar.";
}
function finalKind(){
  if(S.extensiones>=4) return "eterno";
  if(S.extensiones>=1) return "longevo";
  if(S.awards.includes("oraculo")) return "substack";
  if(S.rep>=82&&S.company&&S.company.t>=3) return "fama";
  if(S.cash<0) return "bancarrota";
  return "jubilacion";
}
function buyExtension(){
  const cost=EXT_COSTS[Math.min(S.extensiones,EXT_COSTS.length-1)];
  if(S.cash<cost) return;
  S.cash-=cost; S.extensiones++;
  S.vigencia=clamp(S.vigencia+28); S.riesgo=clamp(S.riesgo+4);
  const e=EXT_NAMES[Math.min(S.extensiones-1,EXT_NAMES.length-1)];
  S.press={outlet:"Instituto de Continuidad",head:`Accede a ${e.n.toLowerCase()} y continúa al frente de la compañía`,
    react:"Los mercados lo celebraron. Tus nietos, un poco menos."};
  S.phase="living"; nextDecision();
}
function pushMilestone(m){ S.milestones.push(m); }
function renderOverlay(){
  const ov=document.getElementById("overlay");
  if(!ov) return;
  if(!S || !S.milestones || !S.milestones.length){ ov.innerHTML=""; return; }
  const m=S.milestones[0];
  ov.innerHTML=`<div class="overlay" onclick="closeMilestone(event)">
    <div class="mile ${m.tone}" onclick="event.stopPropagation()">
      <div class="rays"></div>
      <div class="ic">${m.ic}</div>
      <div class="kick">${m.kick}</div>
      <h3>${m.title}</h3>
      ${m.badge?`<div class="badge2" style="background:${m.badgeBg};color:${m.badgeCol}">${m.badge}</div>`:""}
      <p class="sub">${m.sub}</p>
      <button class="btn" onclick="closeMilestone(event,true)">${m.cta||"Seguir"}</button>
    </div></div>`;
}
function closeMilestone(e,force){
  if(e) e.stopPropagation();
  S.milestones.shift();
  renderOverlay();
}
function endGame(kind){ S.ended=true; S.endReason=kind; S.phase="end"; render(); }

/* ================= RENDER ================= */
function render(){
  const b=document.getElementById("board"), f=document.getElementById("foot");
  document.getElementById("gameName").textContent=GAME.name;
  document.getElementById("gameTag").textContent=GAME.tagline;
  document.title=GAME.name.toUpperCase()+" — "+GAME.tagline;
  f.innerHTML="Todas las empresas, marcas y personas son ficticias. Cualquier parecido con la realidad es responsabilidad de la realidad.";
  
  document.body.className = PACE === "exp" ? "pace-exp" : "";

  if(!S){
    b.style.gridTemplateColumns="1fr";
    b.innerHTML=`<div class="landing"><div class="art">${LANDING_ART}</div>
      <div class="pitch"><div class="eyebrow">Minijuegos</div><h2>${GAME.hero}</h2><p>${GAME.pitch}</p>
      <div class="paces">${PACES.map(p=>`<button class="pace ${PACE===p.id?'on':''}" onclick="PACE='${p.id}';render()">${p.n}</button>`).join("")}</div>
      <div class="pacehint">${PACES.find(p=>p.id===PACE).d}</div>
      <button class="btn" onclick="initSetup()">Comenzar carrera</button></div></div>`;
    return;
  }
  if(S.phase==="setup"){ b.style.gridTemplateColumns="1fr"; b.innerHTML=renderSetup(); return; }
  b.style.gridTemplateColumns="";
  b.innerHTML=`<div>${S.phase==="end"?renderEnd():renderLeft()}</div><div>${renderTimeline()}</div>`;
  tickOvr();
  renderOverlay();
}

function tickOvr(){
  const target=computeOvr();
  const el=document.getElementById("ovrNum");
  if(!el){ S.displayOvr=target; return; }
  const box=el.closest(".ovrblock");
  if(S.displayOvr===undefined) S.displayOvr=target;
  if(S.displayOvr===target){ if(box) box.classList.remove("rising","falling"); return; }
  if(box) box.classList.add(target>S.displayOvr?"rising":"falling");
  const step=()=>{
    if(!document.getElementById("ovrNum")) return;
    if(S.displayOvr===target){
      if(box){ box.classList.remove("rising","falling","ticking"); }
      return;
    }
    S.displayOvr += S.displayOvr<target?1:-1;
    const n=document.getElementById("ovrNum");
    n.textContent=S.displayOvr;
    if(box){
      box.style.background=`linear-gradient(160deg,${ovrColor(S.displayOvr)},#5c4614)`;
      box.classList.add("ticking");
      setTimeout(()=>box.classList.remove("ticking"),90);
    }
    setTimeout(step,70);
  };
  setTimeout(step,180);
}

  if(!S.endApplied){

    if(S.endReason==="cancelado"){S.cash=S.cash*.7;}
    if(S.endReason==="bancarrota"){S.cash=Math.min(S.cash,-50000);}
    if(S.endReason==="substack"){S.cash+=2500000;S.rep=clamp(S.rep+12);}
    S.endApplied=true;
  }

  const familiasAfectadas = S.layoffs * Math.floor(Math.random() * 80 + 30);

  return `
    <div style="background: linear-gradient(180deg, ${e.bg}, var(--panel)); border: 1px solid ${e.color}44; border-radius: 12px; padding: 24px 20px; margin-bottom: 16px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="stamp" style="background:${e.bg};color:${e.color}; margin-bottom: 12px;">${e.stamp}</div>
        <h2 style="font-size: 1.8rem; font-weight: 900; letter-spacing: -.02em; color: var(--ink);">${e.verdict}</h2>
      </div>
      
      <p style="font-size: 1.05rem; color: var(--muted); line-height: 1.6; font-style: italic; border-left: 3px solid ${e.color}; padding-left: 14px; margin-bottom: 28px;">"${e.obit}"</p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
        <div style="background: rgba(0,0,0,.2); padding: 14px; border-radius: 8px; border: 1px solid var(--line);">
          <div style="font-size: .55rem; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;">Patrimonio Final</div>
          <div style="font-size: 1.6rem; font-weight: 900; color: ${S.cash<0?'var(--red)':'var(--money)'};">${money(S.cash)}</div>
        </div>
        <div style="background: rgba(0,0,0,.2); padding: 14px; border-radius: 8px; border: 1px solid var(--line);">
          <div style="font-size: .55rem; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;">Pico de Carrera (OVR)</div>
          <div style="font-size: 1.6rem; font-weight: 900; color: var(--ink);">${S.maxOvr || computeOvr()} <span style="font-size:.65rem; color:var(--muted); font-weight:700; text-transform:uppercase;">/ ${S.maxRank ? S.maxRank.s : S.rank.s}</span></div>
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <div style="font-size: .55rem; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; text-align: center;">Evolución de OVR histórico</div>
        ${renderSparkline()}
      </div>
    </div>

    <div class="counters" style="margin-bottom: 16px;">
      <div class="counter"><div class="lbl">Años Trabajados</div><div class="val">${S.age - 22}</div></div>
      <div class="counter"><div class="lbl">Familias Despedidas</div><div class="val" style="color: var(--red);">${familiasAfectadas}</div></div>
      <div class="counter"><div class="lbl">Empresas Fundidas</div><div class="val">${S.empresasFundidas}</div></div>
    </div>

    ${renderCase()}
    
    <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--line);">
      <div style="font-size:.55rem; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px;">Cambiar ritmo para la próxima</div>
      <div class="paces" style="justify-content:center; margin-bottom:16px;">
        ${PACES.map(p=>`<button class="pace ${PACE===p.id?'on':''}" onclick="PACE='${p.id}'; document.getElementById('board').innerHTML=renderEnd();">${p.n}</button>`).join("")}
      </div>
      <div style="display:flex; gap:8px; justify-content:center;">
        <button class="btn ghost" onclick="initSetup()">Cambiar perfil</button>
        <button class="btn" onclick="startCareer()">Reintentar</button>
      </div>
    </div>`;
}

function renderTimeline(){
  const cad={int:1,nor:2,exp:4}[S.pace||'int'];
  const rows=S.rows.map((r,i)=>`
    <div class="row ${i===S.rows.length-1&&!S.ended?'now':''}" style="animation-delay:${Math.min(i*14,240)}ms">
      <div class="age">${r.years>1?r.age+"-"+(r.age+r.years-1):r.age}</div>
      <div class="co">${logo(r.co)}<span>${r.co?r.co.n:"—"}</span>
        <span class="postag">${r.area?areaById(r.area).s:""}</span>
        <div class="marks">${r.marks.join("")}</div></div>
      <div class="ov" style="background:${ovrColor(r.ovr)}22;color:${ovrColor(r.ovr)}">${r.ovr}</div>
      <div class="rank" style="color:${rankColor(r.rank.i)}">${r.rank.s}</div>
      <div class="rp" style="background:${repColor(r.rep)}22;color:${repColor(r.rep)}">${r.rep}</div>
      <div class="cap">${capF(r.cap)}</div>
    </div>`).join("");
  const ghosts=!S.ended?Array.from({length:Math.max(0,16-S.rows.length)},(_,i)=>`
    <div class="row ghost"><div class="age">${(S.age||22)+1+i*cad}</div><div class="co"><span>—</span></div>
    <div class="ov"></div><div class="rank"></div><div class="rp"></div><div class="cap"></div></div>`).join(""):"";
  return `<div class="timeline">
    <div class="thead"><span>Edad</span><span>Empresa y puesto</span><span>OVR</span><span>Cargo</span><span>Rep</span><span>Cap</span></div>
    <div class="rows">${rows}${ghosts}</div></div>`;
}

render();
</script>
</body>
</html>
